apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: digital-step-flow

resources:
  - ../base

commonLabels:
  app.kubernetes.io/component: backend
  app.kubernetes.io/environment: prod

images:
  - name: raphaelmoraes/digital-step-flow-backend
    newName: raphaelmoraes/digital-step-flow-backend
    newTag: 0.0.1

patches:
  - target:
      kind: Deployment
      name: digital-step-flow-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 3
