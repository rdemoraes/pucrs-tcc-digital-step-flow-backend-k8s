apiVersion: v1
kind: Service
metadata:
  name: digital-step-flow-backend
  namespace: production
  labels:
    app: digital-step-flow-backend
    app.kubernetes.io/component: backend
spec:
  type: ClusterIP
  ports:
  - port: 80
    targetPort: 8080
    protocol: TCP
    name: http
  - port: 8081
    targetPort: 8081
    protocol: TCP
    name: health
  - port: 8082
    targetPort: 8082
    protocol: TCP
    name: metrics
  selector:
    app: digital-step-flow-backend

