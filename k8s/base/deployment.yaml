apiVersion: apps/v1
kind: Deployment
metadata:
  name: digital-step-flow-backend
  namespace: digital-step-flow
  labels:
    app: digital-step-flow-backend
    app.kubernetes.io/component: backend
  annotations:
    checkov.io/skip: CKV_K8S_43:Image digest not practical with Kustomize dynamic tags;CKV2_K8S_6:NetworkPolicy not implemented yet
spec:
  replicas: 2
  selector:
    matchLabels:
      app: digital-step-flow-backend
  template:
    metadata:
      labels:
        app: digital-step-flow-backend
        app.kubernetes.io/component: backend
      annotations:
        container.apparmor.security.beta.kubernetes.io/backend: runtime/default
    spec:
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        seccompProfile:
          type: RuntimeDefault
      containers:
      - name: backend
        # checkov:skip=CKV_K8S_43: Image digest not practical with Kustomize dynamic image tags
        # Image tag will be overridden by dev/prod overlays
        image: raphaelmoraes/digital-step-flow-backend:latest
        imagePullPolicy: Always
        securityContext:
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          runAsUser: 10001
          runAsGroup: 10001
          seccompProfile:
            type: RuntimeDefault
          capabilities:
            drop:
              - ALL
        ports:
        - containerPort: 8080
          name: http
        - containerPort: 8081
          name: health
        - containerPort: 8082
          name: metrics
        env:
        - name: NODE_ENV
          valueFrom:
            configMapKeyRef:
              name: digital-step-flow-config
              key: NODE_ENV
        - name: PORT
          value: "8080"
        - name: HEALTH_PORT
          value: "8081"
        - name: METRICS_PORT
          value: "8082"
        - name: FRONTEND_URL
          valueFrom:
            configMapKeyRef:
              name: digital-step-flow-config
              key: FRONTEND_URL
        - name: SERVICE_NAME
          valueFrom:
            configMapKeyRef:
              name: digital-step-flow-config
              key: SERVICE_NAME
        - name: JWT_SECRET
          valueFrom:
            secretKeyRef:
              name: digital-step-flow-secrets
              key: JWT_SECRET
        - name: POSTGRES_HOST
          valueFrom:
            configMapKeyRef:
              name: digital-step-flow-config
              key: POSTGRES_HOST
        - name: POSTGRES_PORT
          value: "5432"
        - name: POSTGRES_DB
          valueFrom:
            configMapKeyRef:
              name: digital-step-flow-config
              key: POSTGRES_DB
        - name: POSTGRES_USER
          valueFrom:
            secretKeyRef:
              name: digital-step-flow-secrets
              key: POSTGRES_USER
        - name: POSTGRES_PASSWORD
          valueFrom:
            secretKeyRef:
              name: digital-step-flow-secrets
              key: POSTGRES_PASSWORD
        resources:
          requests:
            memory: "128Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
        startupProbe:
          httpGet:
            path: /health
            port: health
            scheme: HTTP
          initialDelaySeconds: 0
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 30
          successThreshold: 1
        livenessProbe:
          httpGet:
            path: /health
            port: health
            scheme: HTTP
          initialDelaySeconds: 30
          periodSeconds: 10
          timeoutSeconds: 5
          failureThreshold: 3
          successThreshold: 1
        readinessProbe:
          httpGet:
            path: /health
            port: health
            scheme: HTTP
          initialDelaySeconds: 5
          periodSeconds: 5
          timeoutSeconds: 3
          failureThreshold: 3
          successThreshold: 1

