apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

namespace: development

resources:
  - ../base

commonLabels:
  app.kubernetes.io/component: backend
  app.kubernetes.io/environment: dev

images:
  - name: raphaelmoraes/digital-step-flow-backend
    newName: raphaelmoraes/digital-step-flow-backend
    newTag: 24.13.0-r1-dev

patches:
  - target:
      kind: Deployment
      name: digital-step-flow-backend
    patch: |-
      - op: replace
        path: /spec/replicas
        value: 1
